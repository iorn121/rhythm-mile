name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Provide placeholder env for the asset bundle
        run: |
          printf '%s\n' 'SPOTIFY_CLIENT_ID=' 'SPOTIFY_REDIRECT_URL=' 'SPOTIFY_CLIENT_SECRET=' > .env
      - run: flutter analyze
      - run: flutter test
